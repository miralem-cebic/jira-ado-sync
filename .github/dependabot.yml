version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Default titles are "Bump x from a to b", which fails the Conventional Commit title check.
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
