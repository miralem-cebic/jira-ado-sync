name: Feature request
description: Suggest an idea or improvement for the sync
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search [existing issues](https://github.com/miralem-cebic/jira-ado-sync/issues) and the non-goals in the [README](https://github.com/miralem-cebic/jira-ado-sync#non-goals-for-now) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this feature solve? Who has this problem?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see, including how it would be configured.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about, including workarounds you currently use.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature
          required: false
        - label: I agree to follow this project's Code of Conduct
          required: true
